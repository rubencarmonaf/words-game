# El plan gratuito de Render duerme el servicio tras ~15 min sin tráfico; el
# primer visitante después de eso espera 30-60 s mientras arranca de nuevo.
# Esto lo mantiene despierto pidiendo /api/health cada 10 min (no toca la
# base de datos, solo responde un JSON fijo). No evita los reinicios de un
# despliegue nuevo o un mantenimiento de Render, solo los de inactividad.
name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: curl --fail --silent --show-error --max-time 20 https://wordwars-ab0f.onrender.com/api/health
