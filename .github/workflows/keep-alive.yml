# El plan gratuito de Render duerme el servicio tras ~15 min sin tráfico; el
# primer visitante después de eso espera 30-60 s mientras arranca de nuevo.
# Esto lo mantiene despierto pidiendo /api/health cada 10 min (no toca la
# base de datos, solo responde un JSON fijo). No evita los reinicios de un
# despliegue nuevo o un mantenimiento de Render, solo los de inactividad.
#
# GitHub no garantiza el minuto exacto de un cron en repos gratuitos — a veces
# se salta uno o dos turnos bajo carga, así que el servicio puede llegar a
# dormirse de verdad antes del siguiente ping. Si eso pasa, despertarlo tarda
# más de lo que un primer intento corto aguanta: reintenta con más margen en
# vez de darlo por caído a la primera.
name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health (con reintento si el servicio estaba dormido)
        run: |
          curl --fail --silent --show-error --max-time 45 https://wordwars-ab0f.onrender.com/api/health \
            || curl --fail --silent --show-error --max-time 90 https://wordwars-ab0f.onrender.com/api/health
