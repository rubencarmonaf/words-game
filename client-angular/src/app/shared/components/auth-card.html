<div class="auth-content">
  <button type="button" class="back-btn" routerLink="/">Volver</button>

  <div class="logo-container">
    <img src="/assets/logo.png" alt="WordWars Logo" class="logo-image" />
  </div>

  <p class="auth-form-intro">Compite con jugadores de todo el mundo</p>

  @if (showTabs()) {
    <div class="auth-tabs">
      <a
        routerLink="/auth"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="tab-btn"
        >Iniciar Sesión</a
      >
      <a routerLink="/auth/register" routerLinkActive="active" class="tab-btn"
        >Registrarse</a
      >
    </div>
  }

  <ng-content />
</div>
