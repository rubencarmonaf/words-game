<div class="game-header">
  <div class="game-info">
    <span id="current-prefix">{{ prefixDisplay() }}</span>
    <span id="game-timer" [class.timer-warning]="timerWarning()" [class.timer-danger]="timerDanger()">
      {{ timerDisplay() }}
    </span>
  </div>
  <div class="game-stats">
    <span id="word-count">{{ wordCountDisplay() }}</span>
  </div>
</div>

<div class="ww-game-rail" aria-hidden="true"><span class="ww-game-rail-dot"></span></div>

<div class="game-content">
  <div class="word-input-section">
    <input
      type="text"
      [formControl]="wordControl"
      [class.word-input--shake]="shakeWord()"
      placeholder="Escribe una palabra..."
      autocomplete="off"
      (keydown.enter)="submit()"
    />
    <button type="button" class="btn btn-primary" [disabled]="submitting()" (click)="submit()">
      {{ submitting() ? 'Validando...' : 'Enviar' }}
    </button>
  </div>

  <div class="words-display">
    <h3>Palabras encontradas:</h3>
    <div id="words-list">
      @for (word of game.words(); track word) {
        <div class="word-item word-item--enter">{{ word }}</div>
      }
    </div>
  </div>
</div>

<div class="game-controls">
  <button type="button" class="btn btn-danger" (click)="endGame()">Terminar Juego</button>
</div>
