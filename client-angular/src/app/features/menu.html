<div class="menu-content">
  <header>
    <div class="logo-container">
      <img src="/assets/logo.png" alt="WordWars Logo" class="logo-image" />
    </div>

    <div class="user-info">
      @if (user(); as u) {
        <button type="button" class="ww-id-chip" routerLink="/profile">
          <ww-avatar [options]="u.avatar" size="md" />
          <span class="ww-id-chip-text">
            <span class="ww-id-chip-name">{{ u.username }}</span>
            <ww-tier-badge [elo]="u.elo" />
          </span>
        </button>
      }
      <button type="button" class="btn btn-secondary" (click)="logout()">Cerrar Sesión</button>
    </div>
  </header>

  <div class="main-content">
    <div class="game-modes-section">
      <h2>Modos de Juego</h2>
      <div class="mode-grid">
        <button type="button" class="mode-card mode-card--featured mode-card--scarlet" routerLink="/play/matchmaking">
          <span class="mode-card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></svg>
          </span>
          <span class="mode-card-body">
            <h3>Versus online</h3>
            <p>Compite contra otros jugadores</p>
          </span>
          <span class="mode-card-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7" /><polyline points="7 7 17 7 17 17" /></svg>
          </span>
        </button>

        <button
          type="button"
          class="mode-card mode-card--featured"
          [class.mode-card--amber]="!dailyStatus()?.isCompleted"
          [class.mode-card--completed]="dailyStatus()?.isCompleted"
          routerLink="/daily-challenge"
        >
          <span class="mode-card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 002.5 2.5z" /></svg>
          </span>
          <span class="mode-card-body">
            <h3>Reto diario</h3>
            @if (dailyStatus()?.isCompleted) {
              <p>✅ Completado · próximo en {{ dailyCountdownDisplay() }}</p>
            } @else {
              <p>2 min · un prefijo, un intento</p>
            }
          </span>
          <span class="mode-card-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7" /><polyline points="7 7 17 7 17 17" /></svg>
          </span>
        </button>

        <button type="button" class="mode-card mode-card--violet" routerLink="/play/setup/solo">
          <span class="mode-card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="5" /><circle cx="12" cy="12" r="1.4" /></svg>
          </span>
          <span class="mode-card-body">
            <h3>Solo</h3>
            <p>Práctica sin límite de tiempo</p>
          </span>
          <span class="mode-card-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7" /><polyline points="7 7 17 7 17 17" /></svg>
          </span>
        </button>

        <button type="button" class="mode-card" routerLink="/play/setup/cadena">
          <span class="mode-card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71" /></svg>
          </span>
          <span class="mode-card-body">
            <h3>Cadena</h3>
            <p>Eliminación por turnos</p>
          </span>
          <span class="mode-card-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7" /><polyline points="7 7 17 7 17 17" /></svg>
          </span>
        </button>

        <button type="button" class="mode-card mode-card--lime" routerLink="/lobby">
          <span class="mode-card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 00-3-3.87" /><path d="M16 3.13a4 4 0 010 7.75" /></svg>
          </span>
          <span class="mode-card-body">
            <h3>Crear lobby</h3>
            <p>Partida cadena con amigos</p>
          </span>
          <span class="mode-card-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7" /><polyline points="7 7 17 7 17 17" /></svg>
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
